
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D People Directory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #050b12;
            font-family: Arial, sans-serif;
            color: white;
        }

        #container {
            position: fixed;
            inset: 0;
        }

        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #8fffff;
            z-index: 10;
            pointer-events: none;
        }

        #status {
            position: absolute;
            top: 45px;
            width: 100%;
            text-align: center;
            color: #8fffff;
            z-index: 10;
            font-size: 12px;
        }

        #menu {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        button {
            color: rgba(127,255,255,0.9);
            background: rgba(0,30,40,0.8);
            outline: 1px solid rgba(127,255,255,0.7);
            border: 0;
            padding: 9px 16px;
            margin: 4px;
            cursor: pointer;
        }

        button:hover {
            background: rgba(0,255,255,0.3);
        }

        .element {
            position: relative;
            width: 120px;
            height: 160px;
            overflow: hidden;
            border: 1px solid rgba(127,255,255,0.5);
            box-shadow: 0 0 12px rgba(0,255,255,0.35);
            background: rgba(0,70,80,0.7);
            text-align: center;
        }

        .element .photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .element .overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.1),
                rgba(0,0,0,0.1) 35%,
                rgba(0,0,0,0.85)
            );
        }

        .element .number {
            position: absolute;
            top: 7px;
            right: 9px;
            z-index: 2;
            font-size: 11px;
            text-shadow: 0 0 5px black;
        }

        .element .symbol {
            position: absolute;
            top: 55px;
            left: 3px;
            right: 3px;
            z-index: 2;
            font-size: 19px;
            font-weight: bold;
            text-shadow: 0 0 8px black;
            overflow-wrap: anywhere;
        }

        .element .details {
            position: absolute;
            bottom: 10px;
            left: 5px;
            right: 5px;
            z-index: 2;
            font-size: 11px;
            line-height: 15px;
            text-shadow: 0 0 6px black;
            overflow-wrap: anywhere;
        }
        .person-card {
            width: 150px;
            height: 210px;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 14px;

            display: flex;
            flex-direction: column;
            align-items: center;

            color: white;
            font-family: Arial, sans-serif;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 2px solid;
            overflow: hidden;

            transition: all 0.3s ease;
        }

        /* Red - Below $100K */
        .person-card.red {
            border-color: #ef3022;
            box-shadow:
                0 0 8px rgba(255, 77, 77, 0.5),
                inset 0 0 8px rgba(255, 77, 77, 0.12);
        }

        /* Orange - $100K to $200K */
        .person-card.orange {
            border-color: #fdca35;
            box-shadow:
                0 0 8px rgba(255, 165, 0, 0.5),
                inset 0 0 8px rgba(255, 165, 0, 0.12);
        }

        /* Green - Above $200K */
        .person-card.green {
            border-color: #3a9f48;
            box-shadow:
                0 0 8px rgba(0, 230, 118, 0.5),
                inset 0 0 8px rgba(0, 230, 118, 0.12);
        }

        /* Header */
        .card-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
        }

        /* Photo */
        .card-photo {
            width: 105px;
            height: 105px;
            object-fit: cover;
            border-radius: 8px;
            margin: 10px 0;
        }

        .card-name {
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            line-height: 16px;

            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;

            overflow-wrap: anywhere;
            min-height: 32px;
        }

        .card-interest {
            font-size: 11px;
            margin-top: 5px;
            text-align: center;
            opacity: 0.8;
            width: 100%;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #logout {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;

            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;

            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);

            color: white;
            font-size: 14px;
            cursor: pointer;

            transition: 0.3s ease;
        }

        #logout:hover {
            background: rgba(255, 255, 255, 0.2);
        }

    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="info">3D People Directory</div>

    <div id="status">Checking login...</div>

    <div id="container"></div>

    <div id="menu">
        <button id="table">TABLE</button>
        <button id="sphere">SPHERE</button>
        <button id="helix">HELIX</button>
        <button id="grid">GRID</button>
        <button id="logout">LOGOUT</button>
    </div>


    <script src="https://accounts.google.com/gsi/client" async defer></script>


    <script type="module">

        import * as THREE from 'three';

        import {
            TrackballControls
        } from 'three/addons/controls/TrackballControls.js';

        import {
            CSS3DRenderer,
            CSS3DObject
        } from 'three/addons/renderers/CSS3DRenderer.js';

        import * as TWEEN from
            'https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@23.1.3/dist/tween.esm.js';


        // =====================================
        // GOOGLE CONFIGURATION
        // =====================================

        const CLIENT_ID =
            '832112878235-dvsre9mk57u3dul7mot1te8amblctsbs.apps.googleusercontent.com';

        const SPREADSHEET_ID =
            '1JC0FqpqJjYZDhkjw96Z4W2Ahm-2vT8HtNdSFcqfqa3U';

        const SHEET_RANGE = 'Sheet1!A2:F';

        const SHEETS_SCOPE =
            'https://www.googleapis.com/auth/spreadsheets.readonly';


        // =====================================
        // CHECK LOGIN
        // =====================================

        const idToken =
            sessionStorage.getItem('google_id_token');
        
        const accessToken =
            sessionStorage.getItem('google_access_token');
        
        if (!idToken || !accessToken) {
        
            window.location.replace('index.html');
        
            throw new Error('Not logged in');
        
        }


        // Verify token with Google's tokeninfo endpoint.
        // This is a basic client-side check, not a substitute
        // for server-side authentication.

        async function verifyLogin() {

            const response = await fetch(
                'https://oauth2.googleapis.com/tokeninfo?id_token=' +
                encodeURIComponent(idToken)
            );

            if (!response.ok) {

                sessionStorage.removeItem('google_id_token');

                window.location.replace('index.html');

                throw new Error('Invalid or expired login');

            }

            const profile = await response.json();

            if (profile.aud !== CLIENT_ID) {

                sessionStorage.removeItem('google_id_token');

                window.location.replace('index.html');

                throw new Error('Invalid login client');

            }

            return profile;

        }


        // =====================================
        // GOOGLE SHEETS ACCESS
        // =====================================

        let tokenClient;

        async function loadGoogleSheet(accessToken) {

            const url =
                `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(SHEET_RANGE)}`;

            const response = await fetch(url, {

                headers: {
                    Authorization: `Bearer ${accessToken}`
                }

            });

            const result = await response.json();

            if (!response.ok) {

                throw new Error(
                    result.error?.message ||
                    'Unable to load Google Sheet'
                );

            }

            return result.values || [];

        }


        // =====================================
        // LOAD PEOPLE
        // =====================================

        async function startApplication() {

          try {
      
              await verifyLogin();
      
              document.getElementById('status').textContent =
                  'Loading Google Sheet...';
      
              const rows = await loadGoogleSheet(accessToken);
              const people = rows
                .filter(row => row.some(value => value !== ''))
                .map(row => ({
                    name: row[0] || 'No Name',
                    photo: row[1] || '',
                    age: row[2] || '',
                    country: row[3] || '',
                    interest: row[4] || '',
                    netWorth: row[5] || ''
                }));
      
              if (people.length === 0) {
                  throw new Error('No data found in Google Sheet');
              }
      
              document.getElementById('status').textContent =
                  `${people.length} people loaded`;
      
              initialize3D(people);
      
          } catch (error) {
      
              console.error(error);
      
              document.getElementById('status').textContent =
                  'Error: ' + error.message;
      
          }
      
      }


        // =====================================
        // LOGOUT
        // =====================================

        document.getElementById('logout')
            .addEventListener('click', () => {
        
                sessionStorage.removeItem('google_id_token');
        
                sessionStorage.removeItem('google_access_token');
        
                window.location.replace('index.html');
        
            });


        // =====================================
        // THREE.JS VARIABLES
        // =====================================

        let camera;
        let scene;
        let renderer;
        let controls;

        const objects = [];

        const targets = {
            table: [],
            sphere: [],
            helix: [],
            grid: []
        };

        const tweenGroup = new TWEEN.Group();


        // =====================================
        // INITIALIZE 3D
        // =====================================

        function initialize3D(people) {

            camera = new THREE.PerspectiveCamera(
                40,
                window.innerWidth / window.innerHeight,
                1,
                10000
            );

            camera.position.z = 4200;

            scene = new THREE.Scene();


            // CREATE CARDS

            for (let i = 0; i < people.length; i++) {

                const person = people[i];
/*
                const element =
                    document.createElement('div');

                element.className = 'element';


                if (person.photo) {

                    const photo =
                        document.createElement('img');

                    photo.className = 'photo';

                    photo.src = person.photo;

                    photo.alt = person.name;

                    photo.referrerPolicy = 'no-referrer';

                    photo.onerror = () => {
                        photo.style.display = 'none';
                    };

                    element.appendChild(photo);

                }


                const overlay =
                    document.createElement('div');

                overlay.className = 'overlay';

                element.appendChild(overlay);


                const number =
                    document.createElement('div');

                number.className = 'number';

                number.textContent = i + 1;

                element.appendChild(number);


                const name =
                    document.createElement('div');

                name.className = 'symbol';

                name.textContent = person.name;

                element.appendChild(name);


                const interest =
                    document.createElement('div');

                interest.className = 'details';

                interest.textContent = person.interest;

                element.appendChild(interest);
*/

                const element = document.createElement('div');

                // Determine background using Net Worth
                const netWorthValue = Number(
                    String(person.netWorth).replace(/[$,]/g, '')
                );

                let worthClass = 'red';

                if (netWorthValue > 200000) {
                    worthClass = 'green';
                } else if (netWorthValue >= 100000) {
                    worthClass = 'orange';
                }

                element.className = `person-card ${worthClass}`;

                // Top section: Country and Age
                const header = document.createElement('div');
                header.className = 'card-header';

                const country = document.createElement('span');
                country.textContent = person.country;

                const age = document.createElement('span');
                age.textContent = person.age;

                header.appendChild(country);
                header.appendChild(age);

                // Center: Photo
                const photo = document.createElement('img');
                photo.className = 'card-photo';
                photo.src = person.photo;
                photo.alt = person.name;
                photo.referrerPolicy = 'no-referrer';

                photo.onerror = () => {
                    photo.style.visibility = 'hidden';
                };

                // Bottom: Name
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = person.name;

                // Bottom: Interest
                const interest = document.createElement('div');
                interest.className = 'card-interest';
                interest.textContent = person.interest;

                // Assemble tile
                element.appendChild(header);
                element.appendChild(photo);
                element.appendChild(name);
                element.appendChild(interest);

                const objectCSS =
                    new CSS3DObject(element);

                objectCSS.position.x =
                    Math.random() * 4000 - 2000;

                objectCSS.position.y =
                    Math.random() * 4000 - 2000;

                objectCSS.position.z =
                    Math.random() * 4000 - 2000;

                scene.add(objectCSS);

                objects.push(objectCSS);


                // TABLE POSITION: 20 COLUMNS

                const column = (i % 20) + 1;

                const row = Math.floor(i / 20) + 1;

                const totalRows =
                    Math.ceil(people.length / 20);

                const object = new THREE.Object3D();

                object.position.x =
                    (column - 10.5) * 145;

                object.position.y =
                    ((totalRows - 1) / 2 - (row - 1)) * 185;

                object.position.z = 0;

                targets.table.push(object);

            }


            // SPHERE

            const vector = new THREE.Vector3();

            for (let i = 0; i < objects.length; i++) {

                const phi = Math.acos(
                    -1 + (2 * i) / objects.length
                );

                const theta =
                    Math.sqrt(objects.length * Math.PI) * phi;

                const object = new THREE.Object3D();

                object.position.setFromSphericalCoords(
                    900,
                    phi,
                    theta
                );

                vector.copy(object.position).multiplyScalar(2);

                object.lookAt(vector);

                targets.sphere.push(object);

            }


            // HELIX

            for (let i = 0; i < objects.length; i++) {

                const strand = i % 2;

                const pairIndex = Math.floor(i / 2);

                // Angle for each strand
                const theta = pairIndex * 0.175 + Math.PI + strand * Math.PI;

                // Vertical position
                const y = -(pairIndex * 8) + 450;

                const object = new THREE.Object3D();

                object.position.setFromCylindricalCoords(
                    900,
                    theta,
                    y
                );

                vector.x = object.position.x * 2;

                vector.y = object.position.y;

                vector.z = object.position.z * 2;

                object.lookAt(vector);

                targets.helix.push(object);

            }


            // GRID

            for (let i = 0; i < objects.length; i++) {

                const object = new THREE.Object3D();

                const x = i % 5;
                const y = Math.floor(i / 5) % 4;
                const z = Math.floor(i / 20);

                object.position.set(
                    (x - 2) * 200,
                    (1.5 - y) * 250,
                    (z - 4.5) * 200
                );

                targets.grid.push(object);

            }


            // RENDERER

            renderer = new CSS3DRenderer();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            document
                .getElementById('container')
                .appendChild(renderer.domElement);


            // CONTROLS

            controls = new TrackballControls(
                camera,
                renderer.domElement
            );

            controls.minDistance = 500;

            controls.maxDistance = 8000;

            controls.addEventListener('change', render);


            // BUTTONS

            document.getElementById('table')
                .addEventListener('click', () => {
                    transform(targets.table, 2000);
                });

            document.getElementById('sphere')
                .addEventListener('click', () => {
                    transform(targets.sphere, 2000);
                });

            document.getElementById('helix')
                .addEventListener('click', () => {
                    transform(targets.helix, 2000);
                });

            document.getElementById('grid')
                .addEventListener('click', () => {
                    transform(targets.grid, 2000);
                });


            transform(targets.table, 2000);

            window.addEventListener(
                'resize',
                onWindowResize
            );

            animate();

        }


        // =====================================
        // TRANSFORM
        // =====================================

        function transform(targetsArray, duration) {

            tweenGroup.removeAll();

            for (let i = 0; i < objects.length; i++) {

                const object = objects[i];

                const target = targetsArray[i];

                new TWEEN.Tween(
                    object.position,
                    tweenGroup
                )
                    .to({

                        x: target.position.x,

                        y: target.position.y,

                        z: target.position.z

                    }, Math.random() * duration + duration)

                    .easing(TWEEN.Easing.Exponential.InOut)

                    .start();


                new TWEEN.Tween(
                    object.rotation,
                    tweenGroup
                )
                    .to({

                        x: target.rotation.x,

                        y: target.rotation.y,

                        z: target.rotation.z

                    }, Math.random() * duration + duration)

                    .easing(TWEEN.Easing.Exponential.InOut)

                    .start();

            }

        }


        // =====================================
        // RESIZE
        // =====================================

        function onWindowResize() {

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            render();

        }


        // =====================================
        // ANIMATION
        // =====================================

        function animate() {

            requestAnimationFrame(animate);

            tweenGroup.update();

            controls.update();

            render();

        }


        function render() {

            renderer.render(scene, camera);

        }


        // START

        startApplication();

    </script>

</body>
</html>
