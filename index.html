
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D People Directory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #050b12;
            font-family: Helvetica, Arial, sans-serif;
            color: white;
        }

        #container {
            position: fixed;
            inset: 0;
        }

        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(127,255,255,0.8);
            z-index: 10;
            pointer-events: none;
            font-size: 14px;
        }

        #loginPanel {
            position: absolute;
            z-index: 20;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        #status {
            font-size: 13px;
            color: #8fffff;
            margin-top: 12px;
        }

        #connectButton {
            display: none;
            margin: 12px auto;
            padding: 10px 18px;
            border: 1px solid rgba(127,255,255,0.7);
            background: rgba(0,127,127,0.3);
            color: white;
            cursor: pointer;
        }

        #connectButton:hover {
            background: rgba(0,255,255,0.3);
        }

        #profile {
            font-size: 13px;
            margin-top: 8px;
            color: white;
        }

        #menu {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        #menu button {
            color: rgba(127,255,255,0.9);
            background: rgba(0,30,40,0.7);
            outline: 1px solid rgba(127,255,255,0.7);
            border: 0;
            padding: 9px 16px;
            margin: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        #menu button:hover {
            background: rgba(0,255,255,0.3);
        }

        .element {
            position: relative;
            width: 120px;
            height: 160px;
            overflow: hidden;
            border: 1px solid rgba(127,255,255,0.5);
            box-shadow: 0 0 12px rgba(0,255,255,0.35);
            background: rgba(0,70,80,0.7);
            font-family: Helvetica, sans-serif;
            text-align: center;
            cursor: default;
        }

        .element:hover {
            border-color: rgba(127,255,255,1);
            box-shadow: 0 0 18px rgba(0,255,255,0.8);
        }

        .element .photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .element .overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.15),
                rgba(0,0,0,0.05) 35%,
                rgba(0,0,0,0.85)
            );
        }

        .element .number {
            position: absolute;
            top: 7px;
            right: 9px;
            z-index: 2;
            font-size: 11px;
            color: white;
            text-shadow: 0 0 5px black;
        }

        .element .symbol {
            position: absolute;
            top: 55px;
            left: 3px;
            right: 3px;
            z-index: 2;
            font-size: 19px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 8px black;
            overflow-wrap: anywhere;
        }

        .element .details {
            position: absolute;
            bottom: 10px;
            left: 5px;
            right: 5px;
            z-index: 2;
            font-size: 11px;
            line-height: 15px;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 0 6px black;
            overflow-wrap: anywhere;
        }

        #loading {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            color: #8fffff;
            z-index: 15;
            display: none;
        }

        @media (max-width: 600px) {
            #menu button {
                padding: 8px 10px;
                font-size: 10px;
                margin: 3px;
            }
        }
    </style>

    <!-- Three.js imports -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="info">
        3D People Directory
    </div>

    <div id="loginPanel">

        <div id="googleButton"></div>

        <div id="profile"></div>

        <button id="connectButton">
            Connect Google Sheet
        </button>

        <div id="status">
            Please sign in with Google
        </div>

    </div>

    <div id="loading">
        Loading data...
    </div>

    <div id="container"></div>

    <div id="menu">
        <button id="table">TABLE</button>
        <button id="sphere">SPHERE</button>
        <button id="helix">HELIX</button>
        <button id="grid">GRID</button>
    </div>


    <script type="module">

        import * as THREE from 'three';

        import {
            TrackballControls
        } from 'three/addons/controls/TrackballControls.js';

        import {
            CSS3DRenderer,
            CSS3DObject
        } from 'three/addons/renderers/CSS3DRenderer.js';

        import * as TWEEN from
            'https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@23.1.3/dist/tween.esm.js';


        // =====================================
        // GOOGLE CONFIGURATION
        // =====================================

        const CLIENT_ID =
            '832112878235-dvsre9mk57u3dul7mot1te8amblctsbs.apps.googleusercontent.com';

        const SPREADSHEET_ID =
            '1JC0FqpqJjYZDhkjw96Z4W2Ahm-2vT8HtNdSFcqfqa3U';

        const SHEET_RANGE = 'Sheet1!A2:C';

        const SHEETS_SCOPE =
            'https://www.googleapis.com/auth/spreadsheets.readonly';


        let tokenClient;
        let accessToken = null;

        const googleButton =
            document.getElementById('googleButton');

        const connectButton =
            document.getElementById('connectButton');

        const statusElement =
            document.getElementById('status');

        const profileElement =
            document.getElementById('profile');


        // =====================================
        // LOAD GOOGLE IDENTITY SERVICES
        // =====================================

        async function loadGoogleScript() {

            return new Promise((resolve, reject) => {

                const script = document.createElement('script');

                script.src =
                    'https://accounts.google.com/gsi/client';

                script.onload = resolve;

                script.onerror = () => {
                    reject(new Error('Google login script failed to load.'));
                };

                document.head.appendChild(script);

            });

        }


        // =====================================
        // INITIALIZE GOOGLE LOGIN
        // =====================================

        async function initializeGoogleLogin() {

            try {

                await loadGoogleScript();

                google.accounts.id.initialize({

                    client_id: CLIENT_ID,

                    callback: handleGoogleLogin

                });


                google.accounts.id.renderButton(

                    googleButton,

                    {
                        theme: 'outline',
                        size: 'large',
                        shape: 'rectangular',
                        text: 'signin_with'
                    }

                );


                // Google Sheets OAuth permission

                tokenClient =
                    google.accounts.oauth2.initTokenClient({

                        client_id: CLIENT_ID,

                        scope: SHEETS_SCOPE,

                        callback: async (response) => {

                            if (response.error) {

                                showError(response.error);

                                return;

                            }

                            accessToken = response.access_token;

                            await loadGoogleSheet();

                        }

                    });


                statusElement.textContent =
                    'Please sign in with Google';

            } catch (error) {

                showError(error.message);

            }

        }


        // =====================================
        // GOOGLE LOGIN CALLBACK
        // =====================================

        function handleGoogleLogin(response) {

            try {

                const payload =
                    JSON.parse(atob(
                        response.credential.split('.')[1]
                    ));

                const name = payload.name || 'Google User';

                const email = payload.email || '';

                profileElement.textContent =
                    `Signed in as ${name} (${email})`;

                statusElement.textContent =
                    'Google login successful. Connect your Sheet next.';

                googleButton.style.display = 'none';

                connectButton.style.display = 'block';

            } catch (error) {

                showError('Unable to read Google profile.');

            }

        }


        // =====================================
        // CONNECT GOOGLE SHEET
        // =====================================

        connectButton.addEventListener('click', () => {

            if (!tokenClient) {

                showError('Google authorization is not ready.');

                return;

            }

            statusElement.textContent =
                'Requesting Google Sheets permission...';

            tokenClient.requestAccessToken({
                prompt: ''
            });

        });


        // =====================================
        // LOAD DATA FROM GOOGLE SHEETS
        // =====================================

        async function loadGoogleSheet() {

            document.getElementById('loading').style.display =
                'block';

            statusElement.textContent =
                'Loading Google Sheet...';

            try {

                const url =
                    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(SHEET_RANGE)}`;

                const response = await fetch(url, {

                    headers: {
                        Authorization: `Bearer ${accessToken}`
                    }

                });


                const result = await response.json();


                if (!response.ok) {

                    throw new Error(
                        `${result.error?.status || response.status}: ` +
                        `${result.error?.message || 'Unable to access Google Sheet'}`
                    );

                }


                const rows = result.values || [];


                if (rows.length === 0) {

                    throw new Error('No data found in Google Sheet.');

                }


                // Convert Google Sheet data
                // A = Photo
                // B = Name
                // C = Interest

                const people = rows
                    .filter(person =>
                        person[0] || person[1] || person[2]
                    )
                    .map(person => ({

                        photo: person[0] || '',

                        name: person[1] || 'No Name',

                        interest: person[2] || ''

                    }));


                if (people.length === 0) {

                    throw new Error('No valid people found.');

                }


                // Hide login panel after successful loading

                document.getElementById('loginPanel')
                    .style.display = 'none';

                document.getElementById('loading')
                    .style.display = 'none';


                // Build 3D table

                initialize3D(people);

                statusElement.textContent =
                    `${people.length} records loaded successfully.`;

            } catch (error) {

                document.getElementById('loading')
                    .style.display = 'none';

                showError(error.message);

            }

        }


        // =====================================
        // ERROR HANDLING
        // =====================================

        function showError(message) {

            statusElement.textContent =
                'Error: ' + message;

            document.getElementById('loading')
                .style.display = 'none';

            console.error(message);

        }


        // =====================================
        // THREE.JS VARIABLES
        // =====================================

        let camera;
        let scene;
        let renderer;
        let controls;

        let animationStarted = false;

        const objects = [];

        const targets = {
            table: [],
            sphere: [],
            helix: [],
            grid: []
        };

        const tweenGroup = new TWEEN.Group();


        // =====================================
        // INITIALIZE 3D PEOPLE DIRECTORY
        // =====================================

        function initialize3D(people) {

            if (animationStarted) return;

            animationStarted = true;

            camera = new THREE.PerspectiveCamera(
                40,
                window.innerWidth / window.innerHeight,
                1,
                10000
            );

            camera.position.z = 4200;

            scene = new THREE.Scene();


            // =================================
            // CREATE PEOPLE CARDS
            // =================================

            for (let i = 0; i < people.length; i++) {

                const person = people[i];

                const element =
                    document.createElement('div');

                element.className = 'element';


                // Photo

                if (person.photo) {

                    const photo =
                        document.createElement('img');

                    photo.className = 'photo';

                    photo.src = person.photo;

                    photo.alt = person.name;

                    photo.referrerPolicy = 'no-referrer';

                    photo.onerror = () => {
                        photo.style.display = 'none';
                    };

                    element.appendChild(photo);

                }


                // Overlay

                const overlay =
                    document.createElement('div');

                overlay.className = 'overlay';

                element.appendChild(overlay);


                // Number

                const number =
                    document.createElement('div');

                number.className = 'number';

                number.textContent = i + 1;

                element.appendChild(number);


                // Name

                const name =
                    document.createElement('div');

                name.className = 'symbol';

                name.textContent = person.name;

                element.appendChild(name);


                // Interest

                const interest =
                    document.createElement('div');

                interest.className = 'details';

                interest.textContent = person.interest;

                element.appendChild(interest);


                // CSS3D Object

                const objectCSS =
                    new CSS3DObject(element);

                objectCSS.position.x =
                    Math.random() * 4000 - 2000;

                objectCSS.position.y =
                    Math.random() * 4000 - 2000;

                objectCSS.position.z =
                    Math.random() * 4000 - 2000;

                scene.add(objectCSS);

                objects.push(objectCSS);


                // =================================
                // TABLE POSITION
                // =================================

                const column = (i % 20) + 1;

                const row = Math.floor(i / 20) + 1;

                const totalRows =
                    Math.ceil(people.length / 20);

                const object = new THREE.Object3D();

                object.position.x =
                    (column - 10.5) * 145;

                object.position.y =
                    ((totalRows - 1) / 2 - (row - 1)) * 185;

                object.position.z = 0;

                targets.table.push(object);

            }


            // =================================
            // SPHERE POSITION
            // =================================

            const vector = new THREE.Vector3();

            for (let i = 0; i < objects.length; i++) {

                const phi = Math.acos(
                    -1 + (2 * i) / objects.length
                );

                const theta =
                    Math.sqrt(objects.length * Math.PI) * phi;

                const object = new THREE.Object3D();

                object.position.setFromSphericalCoords(
                    900,
                    phi,
                    theta
                );

                vector.copy(object.position).multiplyScalar(2);

                object.lookAt(vector);

                targets.sphere.push(object);

            }


            // =================================
            // HELIX POSITION
            // =================================

            for (let i = 0; i < objects.length; i++) {

                const theta = i * 0.175 + Math.PI;

                const y = -(i * 8) + 450;

                const object = new THREE.Object3D();

                object.position.setFromCylindricalCoords(
                    900,
                    theta,
                    y
                );

                vector.x = object.position.x * 2;

                vector.y = object.position.y;

                vector.z = object.position.z * 2;

                object.lookAt(vector);

                targets.helix.push(object);

            }


            // =================================
            // GRID POSITION
            // =================================

            for (let i = 0; i < objects.length; i++) {

                const object = new THREE.Object3D();

                object.position.x =
                    ((i % 5) * 400) - 800;

                object.position.y =
                    (-(Math.floor(i / 5) % 5) * 400) + 800;

                object.position.z =
                    (Math.floor(i / 25) * 1000) - 2000;

                targets.grid.push(object);

            }


            // =================================
            // RENDERER
            // =================================

            renderer = new CSS3DRenderer();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            document
                .getElementById('container')
                .appendChild(renderer.domElement);


            // =================================
            // CONTROLS
            // =================================

            controls = new TrackballControls(
                camera,
                renderer.domElement
            );

            controls.minDistance = 500;

            controls.maxDistance = 8000;

            controls.addEventListener('change', render);


            // =================================
            // BUTTON EVENTS
            // =================================

            document
                .getElementById('table')
                .addEventListener('click', () => {
                    transform(targets.table, 2000);
                });


            document
                .getElementById('sphere')
                .addEventListener('click', () => {
                    transform(targets.sphere, 2000);
                });


            document
                .getElementById('helix')
                .addEventListener('click', () => {
                    transform(targets.helix, 2000);
                });


            document
                .getElementById('grid')
                .addEventListener('click', () => {
                    transform(targets.grid, 2000);
                });


            // Initial layout

            transform(targets.table, 2000);

            window.addEventListener(
                'resize',
                onWindowResize
            );

            animate();

        }


        // =====================================
        // TRANSFORM ANIMATION
        // =====================================

        function transform(targetsArray, duration) {

            tweenGroup.removeAll();

            for (let i = 0; i < objects.length; i++) {

                const object = objects[i];

                const target = targetsArray[i];

                new TWEEN.Tween(
                    object.position,
                    tweenGroup
                )
                    .to({

                        x: target.position.x,

                        y: target.position.y,

                        z: target.position.z

                    }, Math.random() * duration + duration)

                    .easing(TWEEN.Easing.Exponential.InOut)

                    .start();


                new TWEEN.Tween(
                    object.rotation,
                    tweenGroup
                )
                    .to({

                        x: target.rotation.x,

                        y: target.rotation.y,

                        z: target.rotation.z

                    }, Math.random() * duration + duration)

                    .easing(TWEEN.Easing.Exponential.InOut)

                    .start();

            }

        }


        // =====================================
        // WINDOW RESIZE
        // =====================================

        function onWindowResize() {

            if (!camera || !renderer) return;

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            render();

        }


        // =====================================
        // ANIMATION LOOP
        // =====================================

        function animate() {

            requestAnimationFrame(animate);

            tweenGroup.update();

            controls.update();

            render();

        }


        // =====================================
        // RENDER
        // =====================================

        function render() {

            if (renderer && scene && camera) {

                renderer.render(scene, camera);

            }

        }


        // =====================================
        // START GOOGLE LOGIN
        // =====================================

        initializeGoogleLogin();

    </script>

</body>
</html>
