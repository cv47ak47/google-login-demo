
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 40px 25px;
            text-align: center;
            border: 1px solid rgba(127,255,255,0.4);
            border-radius: 12px;
            background: rgba(0,127,127,0.08);
            box-shadow: 0 0 25px rgba(0,255,255,0.1);
        }

        h2 {
            color: #8fffff;
        }

        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        #googleButton {
            display: flex;
            justify-content: center;
        }

        #status {
            margin-top: 20px;
            font-size: 13px;
            color: #8fffff;
        }
    </style>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <div class="login-box">

        <h2>Welcome</h2>

        <p>Sign in to access the 3D People Directory</p>

        <div id="googleButton"></div>

        <div id="status"></div>

    </div>

    <script>

        const CLIENT_ID =
            '832112878235-dvsre9mk57u3dul7mot1te8amblctsbs.apps.googleusercontent.com';

        const SHEETS_SCOPE =
            'https://www.googleapis.com/auth/spreadsheets.readonly';

        let tokenClient;

        let googleIdToken = null;

        function initializeLogin() {

            google.accounts.id.initialize({

                client_id: CLIENT_ID,

                callback: handleGoogleLogin

            });

            google.accounts.id.renderButton(

                document.getElementById('googleButton'),

                {
                    theme: 'outline',
                    size: 'large',
                    shape: 'rectangular',
                    text: 'signin_with'
                }

            );

            tokenClient =
                google.accounts.oauth2.initTokenClient({

                    client_id: CLIENT_ID,

                    scope: SHEETS_SCOPE,

                    callback: handleSheetAuthorization

                });

        }


        // STEP 1: GOOGLE LOGIN

        function handleGoogleLogin(response) {

            googleIdToken = response.credential;

            document.getElementById('status').textContent =
                'Google login successful. Requesting Sheet access...';

            // STEP 2: REQUEST SHEET ACCESS

            tokenClient.requestAccessToken({

                prompt: ''

            });

        }


        // STEP 3: SHEET ACCESS SUCCESS

        function handleSheetAuthorization(response) {

            if (response.error) {

                document.getElementById('status').textContent =
                    'Google Sheet authorization failed: ' + response.error;

                return;

            }

            // Store both tokens for the next page

            sessionStorage.setItem(
                'google_id_token',
                googleIdToken
            );

            sessionStorage.setItem(
                'google_access_token',
                response.access_token
            );

            document.getElementById('status').textContent =
                'Login successful! Redirecting...';

            // Redirect to 3D page

            window.location.href = 'periodic-table.html';

        }


        window.onload = function() {

            initializeLogin();

        };

    </script>

</body>
</html>
